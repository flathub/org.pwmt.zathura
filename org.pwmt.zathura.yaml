---
app-id: org.pwmt.zathura

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: zathura

finish-args:
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=cups

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: girara
    buildsystem: meson
    sources:
      - type: archive
        url: https://pwmt.org/projects/girara/download/girara-2026.07.18.tar.xz
        sha256: d7255635776a45d42d1e555aa425ab96caf23755442474cf240cbac966d8502f
        x-checker-data:
          type: anitya
          project-id: 6750
          url-template: https://pwmt.org/projects/girara/download/girara-$version.tar.xz
  - name: zathura
    buildsystem: meson
    config-opts:
      - -Dseccomp=disabled
      - -Dlandlock=disabled
      - -Dmanpages=disabled
    cleanup:
      - /share/bash-completion
      - /share/fish
      - /share/zsh
    sources:
      - type: archive
        url: https://pwmt.org/projects/zathura/download/zathura-2026.05.20.tar.xz
        sha256: e2e6dc695ebb0170eaa3d39d295c6997c93f23061e6c2b7d3347e03415a2254b
        x-checker-data:
          type: anitya
          project-id: 5298
          url-template: https://pwmt.org/projects/zathura/download/zathura-$version.tar.gz
  - name: zathura-pdf-poppler
    buildsystem: meson
    sources:
      - type: archive
        url: https://pwmt.org/projects/zathura-pdf-poppler/download/zathura-pdf-poppler-2026.07.18.tar.xz
        sha256: 605d3f2c2e90efbc0434bb7206f013dc8ff99d8b679c6b519e13543777635bf1
        x-checker-data:
          type: anitya
          project-id: 14847
          url-template: https://pwmt.org/projects/zathura-pdf-poppler/download/zathura-pdf-poppler-$version.tar.xz
    modules:
      - name: popplerdata
        buildsystem: cmake-ninja
        sources:
          - type: archive
            url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
            sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74
            x-checker-data:
              type: anitya
              project-id: 3687
              url-template: https://poppler.freedesktop.org/poppler-data-$version.tar.xz
      - name: poppler
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=/app/lib
          - -DCMAKE_INSTALL_INCLUDEDIR=/app/include
          - -DBUILD_GTK_TESTS=OFF
          - -DBUILD_CPP_TESTS=OFF
          - -DENABLE_CPP=OFF
          - -DENABLE_BOOST=OFF
          - -DENABLE_GOBJECT_INTROSPECTION=OFF
          - -DENABLE_LIBOPENJPEG=openjpeg2
          - -DENABLE_QT5=OFF
          - -DENABLE_QT6=OFF
        cleanup:
          - /bin
          - /share
        sources:
          - type: archive
            url: https://poppler.freedesktop.org/poppler-26.07.0.tar.xz
            sha256: 304832f48f8a47fdca90c6b6d1f684e68f37c10c9a0726f345f4ca9df4ca01e2
            x-checker-data:
              type: anitya
              project-id: 3686
              url-template: https://poppler.freedesktop.org/poppler-$version.tar.xz
  - name: zathura-djvu
    buildsystem: meson
    sources:
      - type: archive
        url: https://pwmt.org/projects/zathura-djvu/download/zathura-djvu-2026.07.18.tar.xz
        sha256: 451ac83ff99bbcf1e8231abbace77b65793f4ff2bb06e70df053410d454d36a5
        x-checker-data:
          type: anitya
          project-id: 11036
          url-template: https://pwmt.org/projects/zathura-djvu/download/zathura-djvu-$version.tar.xz
    modules:
      - name: djvulibre
        config-opts:
          - --disable-desktopfiles
        cleanup:
          - /bin
        sources:
          - type: archive
            url: http://downloads.sourceforge.net/djvu/djvulibre-3.5.30.tar.gz
            sha256: ee5e457d4cfebe566f94b99e5e3d3cc7f5c79ddb741c2ac2ba2e456f00329644
            x-checker-data:
              type: anitya
              project-id: 10159
              url-template: http://downloads.sourceforge.net/djvu/djvulibre-$version.tar.gz
  - name: zathura-ps
    buildsystem: meson
    sources:
      - type: archive
        url: https://pwmt.org/projects/zathura-ps/download/zathura-ps-2026.07.18.tar.xz
        sha256: 35a3cabc1617fa53b0def887d04ceef3c62a8bd15ddf6f011be0fe0e6fc60587
        x-checker-data:
          type: anitya
          project-id: 14848
          url-template: https://pwmt.org/projects/zathura-ps/download/zathura-ps-$version.tar.xz
    modules:
      - name: ghostscript
        config-opts:
          - --disable-contrib
          - --disable-cups
          - --disable-dbus
          - --disable-gtk
          - --without-pcl
          - --without-tesseract
          - --without-pdftoraster
        make-args:
          - soinstall
        cleanup:
          - /bin
          - /share/doc/ghostscript
        sources:
          - type: archive
            url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10060/ghostscript-10.06.0.tar.xz
            sha256: 64352648c2c081c8a9fb1a12dc1965e01ead7c57f58b72d1b54f6ef1cef3c561
            x-checker-data:
              type: anitya
              project-id: 1157
      - name: libspectre
        sources:
          - type: archive
            url: http://libspectre.freedesktop.org/releases/libspectre-0.2.12.tar.gz
            sha256: 55a7517cd3572bd2565df0cf450944a04d5273b279ebb369a895391957f0f960
            x-checker-data:
              type: anitya
              project-id: 1724
              url-template: http://libspectre.freedesktop.org/releases/libspectre-$version.tar.gz
